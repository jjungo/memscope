[package]
name = "memscope"
version = "0.1.0"
edition = "2024"
description = "Interactive memory layout visualizer for ARM embedded ELF binaries"
repository = "https://github.com/jjungo/memscope"
license = "MIT OR Apache-2.0"
keywords = ["embedded", "arm", "elf", "memory", "analysis"]
categories = ["command-line-utilities", "development-tools", "embedded"]
authors = ["Joël Jungo <j.jungo@gmail.com>"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
goblin = "0.10.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.0.0"
ratatui = "0.29.0"
crossterm = "0.29.0"
fuzzy-matcher = "0.3"
chrono = "0.4"
